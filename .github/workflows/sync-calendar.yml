name: Synchronisation Google Agenda

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installer les dépendances
        run: npm install node-ical node-fetch

      - name: Lancer le script de synchronisation
        run: |
          node scripts/sync-calendar.js
